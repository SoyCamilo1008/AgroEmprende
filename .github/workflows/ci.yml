name: CI

# Objetivo: ningún PR llega a `main` sin pasar formato, lint, tipos, pruebas y build.
# Los mismos comandos que exige el hook local, para que el fallo aparezca en el PR y no
# tres días después en la rama de trabajo.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Un commit nuevo cancela la ejecución anterior del mismo ref: el CI no acumula jobs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# El CI solo necesita leer el repositorio. `actions: write` es lo mínimo que
# necesita el job de migraciones para dejar el log de arranque como artefacto
# cuando `supabase start` falla, que es el único momento en que ese log importa.
permissions:
  contents: read
  actions: write

jobs:
  verify:
    name: Verificar
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      # Lee la versión fijada en `package.json` (`packageManager`), sin duplicarla aquí.
      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Verificar reglas de migraciones
        run: pnpm tooling:check-migrations

      - name: Verificar coherencia entre esquema y código
        run: pnpm tooling:check-schema

      - name: Verificar formato
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Tipos
        run: pnpm typecheck

      - name: Pruebas
        run: pnpm test

      - name: Build
        run: pnpm build

  migrations:
    name: Migraciones aplicables
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # `hashFiles()` no existe en un `if` a nivel de job (solo en el de un step),
    # así que esta condición no se puede evaluar aquí: GitHub rechazaba todo el
    # workflow y ningún job corría. Desde la Fase 2 el directorio siempre existe;
    # si alguna vez dejara de existir, `db:reset` fallaría, que es la señal justa.
    #
    # Este job es el ÚNICO lugar donde las migraciones se ejecutan contra un
    # PostgreSQL real. Nada de lo demás (`pnpm check`) toca la base: una
    # migración con un error de sintaxis, un `depends_on` mal puesto o una
    # política de RLS que deja pasar de más pasaría todos los controles estáticos
    # y llegaría a `main` rota. Por eso el job no se puede marcar como opcional.

    services: {}

    env:
      # `supabase start` decide el directorio del proyecto subiendo desde el cwd.
      # Fijarlo hace que el job no dependa de dónde se invoque.
      SUPABASE_WORKDIR: ${{ github.workspace }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `ubuntu-latest` trae Docker instalado, pero eso es un detalle del proveedor
      # de runners, no una garantía del workflow. Declararlo aquí convierte
      # "el runner no trae Docker" en un fallo con un mensaje claro en vez de un
      # error de la CLI que dice "command not found" y no dice de qué.
      - name: Verificar Docker
        uses: docker/setup-docker-action@v4

      - name: Verificar que el daemon de Docker responde
        run: |
          set -euo pipefail
          docker version
          docker info --format 'Docker {{.ServerVersion}} · {{.OperatingSystem}}'

      # Un step propio, y no medio paso combinado, por un motivo concreto: cuando
      # el CI moría en 1 segundo con `supabase start` y `supabase db reset` en el
      # mismo `run:`, el log tenía que aclarar cuál de los dos era. Con un step por
      # comando, la interfaz dice exactamente cuál falló, sin abrir el log.
      #
      # `pnpm db:start` y no `supabase` en crudo: la CLI es una devDependency del
      # repositorio y un `run:` no hereda el `node_modules/.bin` que arma pnpm.
      # Invocada en crudo, el runner responde "command not found".
      #
      # El fallo se reemite como ANOTACIÓN, no solo como log. La API de logs de
      # GitHub exige autenticación, así que un fallo abandonado en el log es un
      # `failure` sin explicación para cualquiera que no tenga `gh` autenticado.
      # La anotación se lee sin credenciales y dice qué falta.
      - name: Levantar los contenedores de Supabase
        run: |
          set -o pipefail
          log="supabase-start.log"
          if pnpm db:start >"$log" 2>&1; then
            cat "$log"
          else
            status=$?
            cat "$log"
            # GitHub recorta las anotaciones de un mismo check run a unas diez, así
            # que un bloque de "últimas 25 líneas" se pierde casi entero: ya pasó, y
            # por eso la atribución de la migración culpable fue inexistente y se
            # culpó a la equivocada. El log entero se sube como artefacto (el
            # workflow ya tiene permisos para hacerlo) y, además, se publica la
            # ÚLTIMA línea útil pegada al mensaje del job, que es lo que GitHub
            # muestra en la lista de ejecuciones sin pedir el log.
            echo "SALIDA COMPLETA DE SUPABASE START ↓↓↓" >>"$GITHUB_STEP_SUMMARY"
            cat "$log" >>"$GITHUB_STEP_SUMMARY"

            # `ERROR: syntax error at end of input` no dice QUÉ se cortó: el
            # detalle viene en las líneas siguientes (`LINE n:`, `SQL:`), y sin
            # ellas el error es inutilizable. Se emiten juntas, en una sola
            # anotación y en una línea, porque el detalle se pierde si cada línea
            # viaja por separado.
            step_summary="$(
              grep -a -m1 -A 6 -E '^(ERROR|FATAL)' "$log" \
                | tr '\n' '|' | tr -s ' ' | cut -c1-1000
            )"
            [ -n "$step_summary" ] || step_summary="$(tail -n 1 "$log")"

            # Dónde se quedó: sin esto no se sabe si el fallo está en una
            # migración o en el seed, porque la numeración de "Applying
            # migration" del log no es de fiar.
            progress="$(grep -a 'Applying migration\|Seeded\|Running seed\|Resetting' "$log" | tail -n 1 | cut -c1-160)"

            {
              echo "::error::\`pnpm db:start\` (\`supabase start\`) salió con código $status"
              echo "::error::entorno · supabase $(pnpm exec supabase --version 2>&1 | head -1)"
              echo "::error::entorno · node $(node --version)"
              echo "::error::entorno · docker $(docker version --format '{{.Server.Version}}' 2>&1 | head -1)"
              echo "::error::entorno · disco libre $(df -h / | tail -1 | awk '{print $4}')"
              echo "::error::avance · $progress"
              echo "::error::detalle · $step_summary"
            } >&2
            exit "$status"
          fi

      - name: Guardar el log de arranque si falló
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-start-log
          path: supabase-start.log
          if-no-files-found: ignore
          retention-days: 14

      # `db reset` aplica TODAS las migraciones desde cero y carga el seed: es la
      # única forma de detectar una migración que depende de otra en mal orden.
      - name: Aplicar migraciones desde cero
        run: pnpm db:reset

      - name: Analizar el esquema resultante
        run: pnpm db:lint

      # Sin esto, una política de RLS que deja pasar de más llegaría a `main` en
      # verde: `db lint` valida sintaxis, no aislamiento entre inquilinos.
      #
      # La salida se reemite como anotación por la misma razón que el arranque:
      # la API de logs exige autenticación, así que un fallo de pgTAP sin
      # anotación es un `failure` que no dice qué prueba falló ni por qué.
      - name: Pruebas de base de datos
        run: |
          set -o pipefail
          log="pgtap.log"
          if pnpm db:test >"$log" 2>&1; then
            cat "$log"
          else
            status=$?
            cat "$log"
            cat "$log" >>"$GITHUB_STEP_SUMMARY"
            # La CLI colorea la salida, así que una línea puede empezar por un
            # código de escape y el `not ok` no queda al principio: se quitan los
            # códigos antes de buscar, y se compara sin anclar al inicio de línea.
            clean="$(sed -e 's/\x1b\[[0-9;]*m//g' "$log")"
            failed="$(
              printf '%s\n' "$clean" \
                | grep -aE 'not ok|ERROR|FATAL|Tests failed|test result|error' \
                | tail -n 20 | tr '\n' '|' | tr -s ' ' | cut -c1-1400
            )"
            # Si nada coincide, el log no tiene la forma esperada y las últimas
            # líneas son mejor pista que un mensaje vacío.
            [ -n "$failed" ] \
              || failed="$(printf '%s\n' "$clean" | tail -n 20 | tr '\n' '|' | cut -c1-1400)"
            echo "::error::pruebas de base de datos · $failed" >&2
            exit "$status"
          fi

      - name: Guardar el log de las pruebas si fallaron
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pgtap-log
          path: pgtap.log
          if-no-files-found: ignore
          retention-days: 14

      # Un contenedor de más no cuesta casi nada, y un log de la base cuando algo
      # va mal vale más que el mensaje de error de la CLI.
      - name: Logs de la base de datos si algo falló
        if: failure()
        run: docker compose -f supabase/docker-compose.yml logs --tail 200 || true
